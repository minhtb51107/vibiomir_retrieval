[project]
name = "vibiomir-retrieval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "charset-normalizer>=3.4,<4",
  "httpx>=0.28,<1",
  "faiss-cpu>=1.9,<2",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=15,<22",
  "PyYAML>=6,<7",
  "sentence-transformers>=3.4,<6",
  "torch>=2.5.1,<2.6",
  "transformers>=4.41,<4.49",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=test_tmp -p no:cacheprovider"
